name: CI

# One workflow, so a push produces one run rather than two, and publishing
# cannot happen unless the tests that gate it actually passed.
#
# Publishing needs no secrets. The image goes to the GitHub Container Registry
# under the same org as the source, and the login below uses the GITHUB_TOKEN
# the runner already mints for this job, which expires when the job ends.
#
# It used to go to a personal Docker Hub account and needed DOCKERHUB_USERNAME
# and DOCKERHUB_TOKEN kept as repository secrets. Moving it removed both, along
# with the last place the project's distribution carried one individual's name.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/getcodescout/code_scout

jobs:
  test:
    runs-on: ubuntu-latest

    # Integration tests run against a real Postgres, because the behaviour they
    # cover (unique indexes, ON CONFLICT, jsonb) is exactly what a mock cannot
    # exercise. Without CS_TEST_DB they skip.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: code_scout
          POSTGRES_PASSWORD: code_scout
          POSTGRES_DB: code_scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U code_scout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CS_TEST_DB: "host=127.0.0.1 port=5432 user=code_scout password=code_scout dbname=code_scout_test sslmode=disable"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...

      # gofmt is not a matter of taste and nobody should be spending review on
      # it. This was added after `gofmt -l` came back with 54 files, which is
      # the first thing a Go developer runs on a repository they are thinking
      # about contributing to.
      #
      # `gofmt -l` prints the offenders and exits 0 either way, so the file list
      # has to be turned into the failure.
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd. Run 'gofmt -w .' and commit."
            echo "$unformatted"
            exit 1
          fi

      - run: go test ./...

      # Generated files are committed, so a stale one means someone edited a
      # _templ.go by hand or forgot to regenerate. Catch it here rather than
      # in review.
      #
      # The generator is pinned to the version in go.mod. Using @latest would
      # fail this check every time templ cuts a release, since each version
      # stamps its own number into the output.
      - name: Check templ output is up to date
        run: |
          TEMPL_VERSION=$(go list -m -f '{{.Version}}' github.com/a-h/templ)
          echo "Using templ $TEMPL_VERSION (from go.mod)"
          go install github.com/a-h/templ/cmd/templ@"$TEMPL_VERSION"
          TEMPL_EXPERIMENT=rawgo templ generate
          git diff --exit-code -- '*_templ.go' || {
            echo "::error::Generated templ files are stale. Run 'templ generate' and commit."
            exit 1
          }

      # Proves the image builds on pull requests too, where publishing is
      # deliberately skipped. Single-arch here because it is only a smoke test.
      - name: Build the image
        run: docker build -t code_scout:ci .

  publish:
    needs: test
    # Only main and release tags produce an image. Pull requests are excluded
    # too, since their ref is refs/pull/N/merge and none of the tag rules below
    # would match, leaving build-push-action with an empty tag list.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # GITHUB_TOKEN can read packages by default and not write them, so without
    # this the push fails at the very end of a full build with a bare denied.
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The tag and app.Version are two places the same number is written, so
      # they will eventually disagree. This is where that stops being shippable.
      # It runs before the push, so a mismatched tag never produces an image at
      # all rather than producing one labelled with someone else's version.
      #
      # A step rather than its own job: a `needs` on a job that is skipped on
      # main pushes would skip publish along with it.
      - id: guard
        if: startsWith(github.ref, 'refs/tags/v')
        name: Tag must match app.Version
        run: |
          constant=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' app/version.go)
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$constant" ]; then
            echo "::error::Could not read Version out of app/version.go"
            exit 1
          fi
          if [ "$constant" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.Version ($constant). Bump the constant in the release commit."
            exit 1
          fi
          echo "version=$constant" >> "$GITHUB_OUTPUT"
          echo "Tag and constant agree on $constant"

      # QEMU lets one runner build the arm64 image as well, so the image works
      # on Apple Silicon and Graviton, not just x86 servers.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}

  # The GitHub Release, cut from the tag. It runs after publish rather than
  # beside it so the notes never point at an image that does not exist yet, and
  # so the tag/constant guard only has to live in one place.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # CHANGELOG.md is the source of the release notes, so writing them is
      # part of writing the change rather than a thing remembered at tag time.
      # An empty extraction fails the release: notes that are silently blank
      # look identical to a release nobody documented.
      - id: notes
        name: Extract the changelog section for this version
        run: |
          version="${{ needs.publish.outputs.version }}"
          # Stop at the next section, and also at the link definitions at the
          # foot of the file. The oldest release is the last section, so with
          # only the first rule its notes run off the end and collect them.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]"  { inside = 1; next }
            inside && /^## \[/        { exit }
            inside && /^\[[^]]+\]: /  { exit }
            inside                    { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Add one before tagging."
            exit 1
          fi
          echo "Release notes:"; cat release-notes.md

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Attached so a self-hoster who does not want Docker still has something
      # to download. Same ldflags as the Makefile, minus the git branch nobody
      # was reading.
      - name: Build the release binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s \
              -X 'github.com/getcodescout/code_scout/app.Commit=$(git rev-parse --short HEAD)' \
              -X 'github.com/getcodescout/code_scout/app.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o code_scout-linux-amd64 .

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: code_scout-linux-amd64

# The Docker Hub overview is maintained by hand rather than synced from the
# README. The README is written for GitHub and uses relative links that do not
# resolve on Docker Hub, and the description API wants an account password
# rather than an access token.
